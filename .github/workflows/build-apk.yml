name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Make sure the web app folder exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ] && [ -f index.html ]; then cp index.html www/index.html; fi
          ls -la www

      - name: Create the Android project
        run: npx cap add android

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: neuron-school-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
